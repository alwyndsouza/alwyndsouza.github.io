name: Sync Medium Articles

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install markdownify

      - name: Fetch Medium RSS feed
        run: |
          curl -sf "https://medium.com/feed/@aradsouza" -o medium_feed.xml
          if [ ! -s medium_feed.xml ]; then
            echo "ERROR: medium_feed.xml is empty or missing"
            exit 1
          fi
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('medium_feed.xml'); print('RSS feed is valid XML')"

      - name: Import articles
        run: python3 import_medium.py

      - name: Check for new or updated articles
        id: check
        run: |
          CHANGES=$(git status --porcelain frontend/src/articles/ frontend/public/images/ 2>/dev/null)
          if [ -n "$CHANGES" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "New or updated articles found:"
            echo "$CHANGES"
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "No new or updated articles."
          fi

      - name: Commit and push
        if: steps.check.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/articles/
          git add frontend/public/images/ 2>/dev/null || true
          git commit -m "sync: import new articles from Medium"
          git push
