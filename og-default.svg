<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow orb -->
  <ellipse cx="200" cy="200" rx="400" ry="300" fill="url(#glow)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="url(#accent)" opacity="0.4"/>

  <!-- DB icon area -->
  <rect x="80" y="80" width="56" height="56" rx="12" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
  <ellipse cx="108" cy="97" rx="16" ry="5" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M92 97 v10 c0 2.8 7.2 5 16 5 s16-2.2 16-5 V97" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M92 107 v10 c0 2.8 7.2 5 16 5 s16-2.2 16-5 V107" fill="none" stroke="#818cf8" stroke-width="2"/>

  <!-- Name -->
  <text x="80" y="196" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#71717a" font-weight="500" letter-spacing="3">ALWYN D'SOUZA</text>

  <!-- Main headline -->
  <text x="80" y="290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" fill="#fafafa" font-weight="700" letter-spacing="-1">Data &amp; AI</text>
  <text x="80" y="374" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" fill="#fafafa" font-weight="700" letter-spacing="-1">Engineering Leader</text>

  <!-- Sub-headline -->
  <text x="80" y="436" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" fill="#71717a" font-weight="400">DataOps · dbt · Databricks · AI Agents · Modern Data Platforms</text>

  <!-- Stats row -->
  <rect x="80" y="492" width="160" height="68" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="160" y="535" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="15" fill="#818cf8" font-weight="600">Articles</text>

  <rect x="256" y="492" width="160" height="68" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="336" y="523" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="30" fill="#818cf8" font-weight="700">9</text>
  <text x="336" y="548" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="13" fill="#52525b" font-weight="500">OSS Projects</text>

  <rect x="432" y="492" width="160" height="68" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="512" y="523" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="30" fill="#818cf8" font-weight="700">10+</text>
  <text x="512" y="548" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="13" fill="#52525b" font-weight="500">Years</text>

