  <rect x="750" y="200" width="380" height="340" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="940" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#3f3f46" letter-spacing="2">CURRENT FOCUS</text>
  <text x="940" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#f97316" font-weight="600">Databricks · Unity Catalog</text>
  <text x="940" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#fbbf24" font-weight="600">dbt Core · dbt Cloud</text>
  <text x="940" y="354" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#a78bfa" font-weight="600">AI Agents via MCP</text>
  <text x="940" y="388" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#34d399" font-weight="600">DataOps Automation</text>
